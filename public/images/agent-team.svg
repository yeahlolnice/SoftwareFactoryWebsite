<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 640 360" fill="none" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
<title id="t">Agent team diagram</title><desc id="d">A Project Manager agent at the top coordinates an Architect, Designer, Frontend, Backend, DevOps, QA and SEO agent.</desc>
<rect width="640" height="360" rx="12" fill="#0b0f14"/>
<g stroke="#2a3441" stroke-width="1.5"><path d="M320 80V120M80 120H560M80 120V160M160 120V160M240 120V160M320 120V160M400 120V160M480 120V160M560 120V160"/></g>
<rect x="240" y="30" width="160" height="50" rx="8" fill="#0f2a21" stroke="#3ddc97" stroke-width="1.5"/><text x="320" y="60" fill="#e6edf3" text-anchor="middle" font-weight="600">Project Manager</text>
<g fill="#121820" stroke="#2a3441" stroke-width="1.5"><rect x="20" y="160" width="120" height="44" rx="8"/><rect x="100" y="230" width="120" height="44" rx="8"/><rect x="180" y="160" width="120" height="44" rx="8"/><rect x="260" y="230" width="120" height="44" rx="8"/><rect x="340" y="160" width="120" height="44" rx="8"/><rect x="420" y="230" width="120" height="44" rx="8"/><rect x="500" y="160" width="120" height="44" rx="8"/></g>
<g fill="#e6edf3" text-anchor="middle"><text x="80" y="187">Architect</text><text x="160" y="257">Designer</text><text x="240" y="187">Frontend</text><text x="320" y="257">Backend</text><text x="400" y="187">DevOps</text><text x="480" y="257">QA</text><text x="560" y="187">SEO</text></g>
<g stroke="#2a3441" stroke-width="1.5"><path d="M160 204V230M320 204V230M480 204V230" stroke-dasharray="3 4"/></g>
<g fill="#5cb8ff"><circle cx="30" cy="170" r="3"/></g><g fill="#a78bfa"><circle cx="110" cy="240" r="3"/></g><g fill="#3ddc97"><circle cx="430" cy="240" r="3"/></g>
<text x="320" y="325" fill="#9aa7b5" text-anchor="middle">Each agent has a role, a budget and a sandbox</text>
</svg>
