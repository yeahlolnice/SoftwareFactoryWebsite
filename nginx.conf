worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # Not in the stock mime.types; the mp4/webm entries already are (video/mp4, video/webm).
    types {
        text/vtt vtt;
    }
    default_type application/octet-stream;
    charset utf-8;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Hashed Astro assets are immutable; HTML and other files must be revalidated.
    # Video files are long-cached; the render task must rename them (or add a version query) when the content changes.
    map $uri $cache_control {
        ~^/_astro/  "public, max-age=31536000, immutable";
        ~^/video/.+\.(mp4|webm|webp)$  "public, max-age=31536000";
        default     "no-cache";
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Set at server level: add_header in a location block would replace these, so no location sets its own headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Only the html.js marker in Base.astro is inline (allowed by hash); the nav toggle and app mock scripts are external bundles (assetsInlineLimit: 0 in astro.config.mjs).
        # Regenerate the hashes when those scripts change; tests/security-headers.test.mjs fails if they drift.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-sa2BD07tH4oO53uT1B5vNSLM2+gcrREM4WTXttKp6oU='; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control $cache_control always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Range requests (206) let browsers seek and stream the sizzler video. Enabled by default for static
        # files; stated here so it is not lost. gzip is not applied: video types are not in gzip_types.
        location /video/ {
            max_ranges 1;
            try_files $uri =404;
        }

        location ~ /\. {
            deny all;
        }

        location = /404.html {
            internal;
        }

        error_page 404 /404.html;
    }
}
